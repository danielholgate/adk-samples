[project]
name = "froyo_product_analysis"
version = "0.1.0"
description = "A product analysis agent for Froyo, a frozen yoghurt brand, utilizing BigQuery, Dataplex (Knowledge Catalog) MCP server, and Dataproc."
authors = [
    {name = "Antigravity", email = "antigravity@google.com"}
]
license = {text = "Apache License 2.0"}
readme = "README.md"
requires-python = ">=3.11,<3.14"

dependencies = [
    "google-cloud-aiplatform[adk,agent-engines]",
    "google-adk>=2.0.0",
    "google-genai",
    "google-cloud-bigquery>=3.35.0",
    "google-cloud-dataproc>=5.27.0",
    "pandas>=2.3.1,<3.0.0",
    "plotly>=6.0.0,<7.0.0",
    "python-dotenv>=1.1.1,<2.0.0",
    "google-api-core"
]

[dependency-groups]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.7",
    "google-adk[eval]>=1.31.0",
    "nest-asyncio>=1.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["froyo_product_analysis"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
